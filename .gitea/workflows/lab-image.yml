# The lab's warpgate-operator image: upstream's Containerfile, unchanged, built from the
# integration branch (upstream main with every fork branch merged) and pushed to the
# lab's Harbor as <version>-int.<run>. Base images come through Harbor's proxy cache. Gitea runs only these
# workflows (.gitea/workflows), not .github's.
name: lab-image

on:
  push:
    branches: [main]

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          echo "TAG=${version}-int.${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Base images through Harbor
        env:
          REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
        run: |
          sed -i \
            -e "s#^FROM docker.io/library/#FROM ${REGISTRY}/dockerhub/library/#" \
            -e "s#^FROM gcr.io/#FROM ${REGISTRY}/gcr/#" \
            Containerfile
          grep -nE '^FROM' Containerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/warpgate-operator:${{ env.TAG }}
          labels: |
            org.opencontainers.image.title=warpgate-operator
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/pennycoders/warpgate-operator
      - name: Digest
        run: echo "warpgate-operator ${TAG} ${{ steps.build.outputs.digest }}"
